<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能数仓助手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #212121; color: #ECECF1; height: 100vh; display: flex; }

/* 侧边栏 */
.sidebar { width: 260px; background: #171717; display: flex; flex-direction: column; border-right: 1px solid #2E2E2E; }
.sidebar-header { padding: 12px; }
.new-chat-btn { width: 100%; padding: 12px 16px; background: #2E2E2E; color: #ECECF1; border: 1px solid #3E3E3E; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.new-chat-btn:hover { background: #3E3E3E; }
.name-edit-btn { width: 100%; margin-top: 8px; padding: 6px 12px; background: none; color: #666; border: 1px solid #333; border-radius: 6px; cursor: pointer; font-size: 12px; }
.name-edit-btn:hover { color: #ECECF1; border-color: #555; }
.conv-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.conv-item { display: flex; align-items: center; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 2px; color: #ACACBE; }
.conv-item:hover { background: #2E2E2E; color: #ECECF1; }
.conv-item.active { background: #2E2E2E; color: #ECECF1; }
.conv-creator { display: block; font-size: 11px; color: #666; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-actions { display: none; gap: 2px; margin-left: 4px; flex-shrink: 0; }
.conv-item:hover .conv-actions { display: flex; }
.conv-action-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 3px; }
.conv-action-btn:hover { background: #444; color: #ECECF1; }

/* 主区域 */
.main { flex: 1; display: flex; flex-direction: column; max-width: 100%; }
.chat-area { flex: 1; overflow-y: auto; padding: 24px 16px; }
.input-area { padding: 16px 24px; border-top: 1px solid #2E2E2E; }
.input-row { display: flex; gap: 8px; max-width: 1100px; margin: 0 auto; }
.input-row input { flex: 1; padding: 14px 16px; background: #2E2E2E; color: #ECECF1; border: 1px solid #3E3E3E; border-radius: 12px; font-size: 14px; outline: none; }
.input-row input:focus { border-color: #6E6E8E; }
.input-row button { padding: 10px 20px; background: #ECECF1; color: #212121; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 500; }
.input-row button:hover { background: #FFF; }
.input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

/* 消息 */
.msg { display: flex; gap: 16px; margin-bottom: 24px; max-width: 1100px; margin-left: auto; margin-right: auto; }
.msg.user { flex-direction: row-reverse; }
.msg .avatar { width: 32px; height: 32px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.msg.assistant .avatar { background: #10A37F; }
.msg.user .avatar { background: #5C4EC2; }
.msg .bubble { padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.6; max-width: 100%; }
.msg.assistant .bubble { background: #2E2E2E; }
.msg.user .bubble { background: #3A3A5C; }
.msg .bubble pre { background: #1A1A1A; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-size: 12px; white-space: pre-wrap; word-break: break-all; }

/* 折叠面板 */
.collapse { margin-top: 10px; }
/* 思考过程面板位于回复内容上方，间距与内容面板区分 */
.collapse.thinking-panel { margin-top: 0; margin-bottom: 10px; }
.collapse-btn { display: flex; align-items: center; gap: 4px; background: none; border: none; color: #888; cursor: pointer; font-size: 12px; padding: 4px 0; }
.collapse-btn:hover { color: #ECECF1; }
.collapse-btn .arrow { transition: transform 0.2s; display: inline-block; font-size: 10px; }
.collapse-btn.open .arrow { transform: rotate(90deg); }
.collapse-content { display: none; margin-top: 6px; padding: 10px; background: #1A1A1A; border-radius: 6px; font-size: 12px; color: #ACACBE; white-space: pre-wrap; line-height: 1.5; max-height: 400px; overflow-y: auto; }
.collapse-content.show { display: block; }

/* 评分 */
.request-id { margin-top: 6px; font-size: 11px; color: #666; font-family: Consolas, monospace; user-select: all; }
.token-usage { margin-top: 6px; font-size: 13px; color: #9A9AAC; font-family: Consolas, monospace; }
.score-area { margin-top: 8px; display: flex; align-items: center; gap: 4px; font-size: 12px; color: #888; }
.score-area .star { background: none; border: none; color: #555; cursor: pointer; font-size: 18px; }
.score-area .star:hover, .score-area .star.active { color: #F0C040; }
.score-area .done { color: #10A37F; margin-left: 4px; }

/* 空状态 */
.empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #666; font-size: 16px; }

/* 加载 */
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #555; border-top-color: #ECECF1; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: flex; align-items: center; gap: 8px; color: #888; font-size: 13px; max-width: 1100px; margin: 16px auto; }

/* Markdown 渲染样式（LLM 回答以 md 显示） */
.msg .bubble h1, .msg .bubble h2, .msg .bubble h3, .msg .bubble h4 { margin: 10px 0 6px; line-height: 1.3; }
.msg .bubble h1 { font-size: 18px; }
.msg .bubble h2 { font-size: 16px; }
.msg .bubble h3 { font-size: 15px; }
.msg .bubble h4 { font-size: 14px; }
.msg .bubble p { margin: 6px 0; }
.msg .bubble ul, .msg .bubble ol { margin: 6px 0; padding-left: 22px; }
.msg .bubble li { margin: 3px 0; }
.msg .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
.msg .bubble th, .msg .bubble td { border: 1px solid #444; padding: 5px 10px; text-align: left; white-space: nowrap; }
.msg .bubble th { background: #3A3A3A; font-weight: 600; }
.msg .bubble blockquote { border-left: 3px solid #10A37F; margin: 8px 0; padding: 4px 12px; color: #ACACBE; background: #1A1A1A; border-radius: 0 6px 6px 0; }
.msg .bubble code { background: #1A1A1A; padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: Consolas, monospace; }
.msg .bubble pre code { background: none; padding: 0; }
.msg .bubble del { color: #888; }

/* 最终回答逐字预览区 */
.pending-answer { margin-top: 10px; padding: 10px; background: #1A1A1A; border-radius: 6px; font-size: 14px; color: #ECECF1; white-space: pre-wrap; line-height: 1.6; }


/* 上下文使用进度与压缩提示（仿 Codex） */
.context-info { margin-top: 8px; font-size: 12px; color: #888; }

/* 上下文使用圆环（输入框左侧，仿 Codex）：环形进度 + hover 展示具体用量 */
.ctx-ring-wrap { display: flex; align-items: center; cursor: default; position: relative; flex-shrink: 0; }
.ctx-ring-svg { width: 34px; height: 34px; transform: rotate(-90deg); display: block; }
.ctx-ring-bg { fill: none; stroke: #3E3E3E; stroke-width: 3; }
.ctx-ring-fg { fill: none; stroke: #10A37F; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.4s ease; }
.ctx-ring-fg.warn { stroke: #F0C040; }
.ctx-ring-fg.danger { stroke: #E5484D; }
.ctx-ring-tip { display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: #171717; color: #ECECF1; border: 1px solid #3E3E3E; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; white-space: nowrap; z-index: 10; line-height: 1.5; }
.ctx-ring-wrap:hover .ctx-ring-tip { display: block; }
.ctx-ring-tip .tip-compacted { color: #F0C040; }
.context-bar { height: 4px; background: #333; border-radius: 2px; overflow: hidden; margin-top: 4px; }
.context-bar-fill { height: 100%; width: 0%; background: #10A37F; transition: width 0.4s ease; }
.context-bar-fill.warn { background: #F0C040; }
.context-bar-fill.danger { background: #E5484D; }
.context-compacted { margin-top: 4px; color: #F0C040; }
/* 称呼设置弹层（首次进入显示，用户可自行选择确定或跳过） */
.name-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 100; }
.name-dialog { background: #2E2E2E; border: 1px solid #3E3E3E; border-radius: 12px; padding: 24px 28px; width: 340px; text-align: center; }
.name-dialog h3 { margin-bottom: 8px; font-size: 16px; color: #ECECF1; }
.name-dialog-desc { margin-bottom: 14px; font-size: 12px; color: #888; }
.name-dialog input { width: 100%; padding: 10px 12px; background: #1A1A1A; color: #ECECF1; border: 1px solid #3E3E3E; border-radius: 8px; font-size: 14px; outline: none; }
.name-dialog input:focus { border-color: #6E6E8E; }
.name-dialog-btns { margin-top: 16px; display: flex; gap: 8px; justify-content: center; }
.name-dialog-btns button { padding: 8px 20px; background: #ECECF1; color: #212121; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.name-dialog-btns button.secondary { background: #3A3A3A; color: #ACACBE; }
.name-dialog-btns button:hover { opacity: .9; }
</style>
</head>
<body>

<!-- 侧边栏 -->
<div class="sidebar">
    <div class="sidebar-header">
        <button class="new-chat-btn" onclick="newChat()">+ 新建对话</button>
        <button class="name-edit-btn" onclick="openNameOverlay()" title="设置称呼">✎ 设置称呼</button>
    </div>
    <div class="conv-list" id="convList"></div>
</div>

<!-- 主区域 -->
<div class="main">
    <div class="chat-area" id="chatArea">
        <div class="empty-state" id="emptyState">👋 新建一个对话开始查询吧</div>
    </div>
    <div class="input-area">
        <div class="input-row">
            <div id="ctxRingWrap" class="ctx-ring-wrap" title="上下文使用情况">
                <svg id="ctxRingSvg" class="ctx-ring-svg" viewBox="0 0 36 36">
                    <circle class="ctx-ring-bg" cx="18" cy="18" r="15.5"></circle>
                    <circle class="ctx-ring-fg" cx="18" cy="18" r="15.5"></circle>
                </svg>
                <div class="ctx-ring-tip" id="ctxRingTip">上下文使用情况</div>
            </div>
            <input type="text" id="msgInput" placeholder="输入你的数据查询需求..." onkeydown="if(event.key==='Enter') sendMsg()" />
            <button id="sendBtn" onclick="sendMsg()">发送</button>
        </div>
    </div>
</div>

<!-- 称呼设置弹层（首次进入显示，用户可自行选择确定或跳过，不用 prompt 避免切窗口消失） -->
<div class="name-overlay" id="nameOverlay" style="display:none;">
    <div class="name-dialog">
        <h3>设置您的称呼</h3>
        <p class="name-dialog-desc">仅用于区分不同用户的对话，测试用</p>
        <input type="text" id="nameInput" placeholder="请输入称呼（可留空）" maxlength="30" onkeydown="if(event.key==='Enter') confirmName()" />
        <div class="name-dialog-btns">
            <button id="nameConfirm" onclick="confirmName()">确定</button>
            <button id="nameSkip" class="secondary" onclick="skipName()">取消</button>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
