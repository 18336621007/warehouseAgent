<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能数仓助手</title>
<script>
try {
  var th = localStorage.getItem("theme") || "dark";
  document.documentElement.setAttribute("data-theme", th);
} catch (e) {}
</script>
<style>
/* ===== 主题配色方案 ===== */
:root {
  --bg: #212121;
  --sidebar-bg: #171717;
  --panel-bg: #2E2E2E;
  --panel-alt: #3A3A5C;
  --header-bg: #3A3A3A;
  --hover-bg: #3E3E3E;
  --code-bg: #1A1A1A;
  --border: #2E2E2E;
  --border-mid: #3E3E3E;
  --border-strong: #444;
  --border-dim: #333;
  --focus-border: #6E6E8E;
  --text: #ECECF1;
  --text-sub: #ACACBE;
  --text-faint: #9A9AAC;
  --text-dim: #888;
  --text-muted: #666;
  --accent: #10A37F;
  --accent2: #5C4EC2;
  --warn: #F0C040;
  --danger: #E5484D;
  --danger2: #E46C6C;
  --accent-rgb: 16, 163, 127;
  --accent2-rgb: 92, 78, 194;
  --button-bg: #ECECF1;
  --button-text: #212121;
  --button-hover: #FFFFFF;
}
/* 明亮浅色 */
[data-theme="light"] {
  --bg: #F4F4F7;
  --sidebar-bg: #ECECF0;
  --panel-bg: #FFFFFF;
  --panel-alt: #EAEAF5;
  --header-bg: #E4E4EC;
  --hover-bg: #DEDEE6;
  --code-bg: #F0F0F4;
  --border: #E0E0E6;
  --border-mid: #C9C9D2;
  --border-strong: #B5B5BE;
  --border-dim: #C5C5CC;
  --focus-border: #6E6E8E;
  --text: #1F1F24;
  --text-sub: #51515C;
  --text-faint: #6F6F7A;
  --text-dim: #8A8A94;
  --text-muted: #A0A0AA;
  --accent: #0E8A6E;
  --accent2: #6C5CE7;
  --warn: #D9820B;
  --danger: #D64545;
  --danger2: #D64545;
  --accent-rgb: 14, 138, 110;
  --accent2-rgb: 108, 92, 231;
  --button-bg: #22222A;
  --button-text: #F7F7FA;
  --button-hover: #3A3A44;
}
/* 护眼森林 */
[data-theme="forest"] {
  --bg: #14221B;
  --sidebar-bg: #0F1915;
  --panel-bg: #1D2D24;
  --panel-alt: #25402F;
  --header-bg: #243729;
  --hover-bg: #2A3D31;
  --code-bg: #101B16;
  --border: #2A3D31;
  --border-mid: #35503F;
  --border-strong: #446654;
  --border-dim: #2C4034;
  --focus-border: #5EA97B;
  --text: #E8F2EC;
  --text-sub: #A6C3B0;
  --text-faint: #8AA89A;
  --text-dim: #7C9B8C;
  --text-muted: #647F70;
  --accent: #34C486;
  --accent2: #7FA64F;
  --warn: #F0C040;
  --danger: #E5484D;
  --danger2: #E46C6C;
  --accent-rgb: 52, 196, 134;
  --accent2-rgb: 127, 166, 79;
  --button-bg: #DFEBD9;
  --button-text: #121A15;
  --button-hover: #B5CBB0;
}
/* 海洋蓝 */
[data-theme="ocean"] {
  --bg: #101A2A;
  --sidebar-bg: #0C1422;
  --panel-bg: #17263C;
  --panel-alt: #1E324D;
  --header-bg: #1E324D;
  --hover-bg: #223A5C;
  --code-bg: #0B111D;
  --border: #223A5C;
  --border-mid: #2C4A73;
  --border-strong: #36598C;
  --border-dim: #233A5A;
  --focus-border: #4E8CF0;
  --text: #E6F0FB;
  --text-sub: #A8BEDC;
  --text-faint: #8298B5;
  --text-dim: #748AA8;
  --text-muted: #5D7396;
  --accent: #4E8CF0;
  --accent2: #8A6CF0;
  --warn: #F0C040;
  --danger: #E5484D;
  --danger2: #E46C6C;
  --accent-rgb: 78, 140, 240;
  --accent2-rgb: 138, 108, 240;
  --button-bg: #DFE9FA;
  --button-text: #101A26;
  --button-hover: #B8CEF2;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }

/* 侧边栏 */
.sidebar { width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid var(--panel-bg); }
.sidebar-header { padding: 12px; }
.new-chat-btn { width: 100%; padding: 12px 16px; background: var(--panel-bg); color: var(--text); border: 1px solid var(--hover-bg); border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: background 0.2s ease, border-color 0.2s ease; }
.new-chat-btn:hover { background: var(--hover-bg); }
.name-edit-btn { width: 100%; margin-top: 8px; padding: 6px 12px; background: none; color: var(--text-muted); border: 1px solid var(--border-dim); border-radius: 6px; cursor: pointer; font-size: 12px; }
.name-edit-btn:hover { color: var(--text); border-color: var(--border-mid); }
.conv-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.conv-item { display: flex; align-items: center; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 2px; color: var(--text-sub); transition: background 0.15s ease, color 0.15s ease; }
.conv-item:hover { background: var(--panel-bg); color: var(--text); }
.conv-item.active { background: var(--panel-bg); color: var(--text); }
.conv-creator { display: block; font-size: 11px; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-actions { display: none; gap: 2px; margin-left: 4px; flex-shrink: 0; }
.conv-item:hover .conv-actions { display: flex; }
.conv-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 3px; }
.conv-action-btn:hover { background: var(--border-strong); color: var(--text); }
.conv-status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
.conv-status.spinner { width: 12px; height: 12px; border: 2px solid var(--border-mid); border-top-color: var(--accent); animation: spin 0.6s linear infinite; }
.conv-status.done { background: var(--accent); box-shadow: 0 0 6px rgba(var(--accent-rgb),0.7); }

/* 主区域 */
.main { flex: 1; display: flex; flex-direction: column; max-width: 100%; }
.chat-area { flex: 1; overflow-y: auto; padding: 24px 16px; }
.input-area { padding: 16px 24px; border-top: 1px solid var(--panel-bg); }
.input-row { display: flex; gap: 8px; max-width: 1100px; margin: 0 auto; }
.input-row input { flex: 1; padding: 14px 16px; background: var(--panel-bg); color: var(--text); border: 1px solid var(--hover-bg); border-radius: 12px; font-size: 14px; outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
.input-row input:focus { border-color: var(--focus-border); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.18); }
.input-row button { padding: 10px 20px; background: var(--button-bg); color: var(--button-text); border: none; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 500; transition: background 0.2s ease, transform 0.12s ease; }
.input-row button:hover { background: var(--button-hover); }
.input-row button:active { transform: scale(0.97); }
.input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

/* 消息 */
.msg { display: flex; gap: 16px; margin-bottom: 24px; max-width: 1100px; margin-left: auto; margin-right: auto; animation: msg-in 0.22s ease both; }
.msg.user { flex-direction: row-reverse; }
.msg .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.msg.assistant .avatar { background: var(--accent); }
.msg.user .avatar { background: var(--accent2); }
.msg .bubble { padding: 14px 18px; border-radius: 14px; font-size: 14px; line-height: 1.6; max-width: 100%; border: 1px solid var(--border-mid); transition: background 0.2s ease, border-color 0.2s ease; }
.msg.assistant .bubble { background: var(--panel-bg); }
.msg.user .bubble { background: var(--panel-alt); border-color: var(--border-strong); }
.msg .bubble pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-size: 12px; white-space: pre-wrap; word-break: break-all; }

/* 折叠面板 */
.collapse { margin-top: 10px; }
/* 思考过程面板位于回复内容上方，间距与内容面板区分 */
.collapse.thinking-panel { margin-top: 0; margin-bottom: 10px; }
.collapse-btn { display: flex; align-items: center; gap: 4px; background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px; padding: 4px 0; transition: color 0.2s ease; }
.collapse-btn:hover { color: var(--text); }
.collapse-btn .arrow { transition: transform 0.25s ease; display: inline-block; font-size: 10px; }
.collapse-btn.open .arrow { transform: rotate(90deg); }
.collapse-content { max-height: 0; opacity: 0; overflow: hidden; margin-top: 0; padding: 0 10px; background: var(--code-bg); border-radius: 8px; font-size: 12px; color: var(--text-sub); white-space: pre-wrap; line-height: 1.5; transition: max-height 0.28s ease, opacity 0.22s ease, padding 0.28s ease, margin-top 0.28s ease; scrollbar-gutter: stable; }
.collapse-content.show { max-height: 400px; opacity: 1; margin-top: 6px; padding: 10px; overflow-y: auto; }

/* 评分 */
.request-id { margin-top: 6px; font-size: 11px; color: var(--text-muted); font-family: Consolas, monospace; user-select: all; }
.msg-time { margin-bottom: 8px; font-size: 13px; color: var(--text-dim); }
.token-usage { margin-top: 6px; font-size: 13px; color: var(--text-faint); font-family: Consolas, monospace; }
.score-area { margin-top: 8px; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-dim); }
.score-area .star { background: none; border: none; color: var(--border-mid); cursor: pointer; font-size: 18px; }
.score-area .star:hover, .score-area .star.active { color: var(--warn); }
.score-area .done { color: var(--accent); margin-left: 4px; }

/* 空状态 */
.empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 16px; }

/* 加载 */
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border-mid); border-top-color: var(--text); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.loading { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 13px; max-width: 1100px; margin: 16px auto; }

/* Markdown 渲染样式（LLM 回答以 md 显示） */
.msg .bubble h1, .msg .bubble h2, .msg .bubble h3, .msg .bubble h4 { margin: 10px 0 6px; line-height: 1.3; }
.msg .bubble h1 { font-size: 18px; }
.msg .bubble h2 { font-size: 16px; }
.msg .bubble h3 { font-size: 15px; }
.msg .bubble h4 { font-size: 14px; }
.msg .bubble p { margin: 6px 0; }
.msg .bubble ul, .msg .bubble ol { margin: 6px 0; padding-left: 22px; }
.msg .bubble li { margin: 3px 0; }
.msg .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
.msg .bubble th, .msg .bubble td { border: 1px solid var(--border-strong); padding: 5px 10px; text-align: left; white-space: nowrap; }
.msg .bubble th { background: var(--header-bg); font-weight: 600; }
.msg .bubble blockquote { border-left: 3px solid var(--accent); margin: 8px 0; padding: 4px 12px; color: var(--text-sub); background: var(--code-bg); border-radius: 0 6px 6px 0; }
.msg .bubble code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: Consolas, monospace; }
.msg .bubble pre code { background: none; padding: 0; }
.msg .bubble del { color: var(--text-dim); }

/* 最终回答逐字预览区：背景与气泡一致，流式→完成切换不跳色 */
.pending-answer { margin-top: 10px; padding: 0 2px; background: transparent; font-size: 14px; color: var(--text); white-space: pre-wrap; line-height: 1.6; animation: fade-in 0.25s ease; }

/* 图表展示（ECharts 渲染，数据来自 execute_query 真实结果） */
.chart-box { width: 100%; height: 350px; margin: 10px 0; background: transparent; display: flex; flex-direction: column; }
.chart-toolbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 0 6px; }
.chart-type-btn { background: var(--hover-bg); border: 1px solid var(--border-strong); color: var(--text-sub); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; transition: all 0.15s ease; }
.chart-type-btn:hover { border-color: var(--accent); color: var(--text); }
.chart-type-btn.active { background: rgba(var(--accent-rgb),0.18); border-color: var(--accent); color: var(--accent); }
.chart-holder { flex: 1; min-height: 280px; }
.chart-pending { display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 13px; border: 1px dashed var(--border-dim); border-radius: 8px; height: 160px; }
/* 生成图表按钮（仿豆包）：回答未含图表时展示，点击后按落盘结果生成图表 */
.chart-gen-btn { margin-top: 10px; background: rgba(var(--accent-rgb), 0.12); color: var(--accent); border: 1px solid rgba(var(--accent-rgb), 0.5); border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease; }
.chart-gen-btn:hover { background: rgba(var(--accent-rgb), 0.22); }
.chart-gen-btn:disabled { opacity: 0.6; cursor: default; }
.chart-gen-error { margin-top: 8px; font-size: 12px; color: var(--danger2); }


/* 上下文使用进度与压缩提示（仿 Codex） */
.context-info { margin-top: 8px; font-size: 12px; color: var(--text-dim); }

/* 上下文使用圆环（输入框左侧，仿 Codex）：环形进度 + hover 展示具体用量 */
.ctx-ring-wrap { display: flex; align-items: center; cursor: default; position: relative; flex-shrink: 0; }
.ctx-ring-svg { width: 34px; height: 34px; transform: rotate(-90deg); display: block; }
.ctx-ring-bg { fill: none; stroke: var(--hover-bg); stroke-width: 3; }
.ctx-ring-fg { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.4s ease; }
.ctx-ring-fg.warn { stroke: var(--warn); }
.ctx-ring-fg.danger { stroke: var(--danger); }
.ctx-ring-tip { display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: var(--sidebar-bg); color: var(--text); border: 1px solid var(--hover-bg); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; white-space: nowrap; z-index: 10; line-height: 1.5; }
.ctx-ring-wrap:hover .ctx-ring-tip { display: block; }
.ctx-ring-tip .tip-compacted { color: var(--warn); }
.context-bar { height: 4px; background: var(--border-dim); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.context-bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.4s ease; }
.context-bar-fill.warn { background: var(--warn); }
.context-bar-fill.danger { background: var(--danger); }
.context-compacted { margin-top: 4px; color: var(--warn); }
/* 称呼设置弹层（首次进入显示，用户可自行选择确定或跳过） */
.name-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 100; }
.name-dialog { background: var(--panel-bg); border: 1px solid var(--hover-bg); border-radius: 12px; padding: 24px 28px; width: 340px; text-align: center; }
.name-dialog h3 { margin-bottom: 8px; font-size: 16px; color: var(--text); }
.name-dialog-desc { margin-bottom: 14px; font-size: 12px; color: var(--text-dim); }
.name-dialog input { width: 100%; padding: 10px 12px; background: var(--code-bg); color: var(--text); border: 1px solid var(--hover-bg); border-radius: 8px; font-size: 14px; outline: none; }
.name-dialog input:focus { border-color: var(--focus-border); }
.name-dialog-btns { margin-top: 16px; display: flex; gap: 8px; justify-content: center; }
.name-dialog-btns button { padding: 8px 20px; background: var(--button-bg); color: var(--button-text); border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.name-dialog-btns button.secondary { background: var(--header-bg); color: var(--text-sub); }
.name-dialog-btns button:hover { opacity: .9; }

/* 滚动条美化 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--hover-bg); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-mid); }

/* 主题选择器 */
.theme-select-wrap { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.theme-select-wrap label { color: var(--text-muted); font-size: 12px; flex-shrink: 0; }
.theme-select { flex: 1; min-width: 0; padding: 5px 8px; background: var(--panel-bg); color: var(--text); border: 1px solid var(--border-mid); border-radius: 6px; font-size: 12px; outline: none; cursor: pointer; }
.theme-select:hover { border-color: var(--accent); }
.theme-select option { background: var(--panel-bg); color: var(--text); }

/* 主题切换平滑过渡：仅切换期间生效，避免长期全局 transition 干扰既有动画 */
html.theme-switching, html.theme-switching * {
  transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, fill 0.35s ease, stroke 0.35s ease !important;
}
</style>
</head>
<body>

<!-- 侧边栏 -->
<div class="sidebar">
    <div class="sidebar-header">
        <button class="new-chat-btn" onclick="newChat()">+ 新建对话</button>
        <button class="name-edit-btn" onclick="openNameOverlay()" title="设置称呼">✎ 设置称呼</button>
        <div class="theme-select-wrap">
            <label for="themeSelect">主题</label>
            <select id="themeSelect" class="theme-select">
                <option value="dark">暗夜经典</option>
                <option value="light">明亮浅色</option>
                <option value="forest">护眼森林</option>
                <option value="ocean">海洋蓝</option>
            </select>
        </div>
    </div>
    <div class="conv-list" id="convList"></div>
</div>

<!-- 主区域 -->
<div class="main">
    <div class="chat-area" id="chatArea">
        <div class="empty-state" id="emptyState">👋 新建一个对话开始查询吧</div>
    </div>
    <div class="input-area">
        <div class="input-row">
            <div id="ctxRingWrap" class="ctx-ring-wrap" title="上下文使用情况">
                <svg id="ctxRingSvg" class="ctx-ring-svg" viewBox="0 0 36 36">
                    <circle class="ctx-ring-bg" cx="18" cy="18" r="15.5"></circle>
                    <circle class="ctx-ring-fg" cx="18" cy="18" r="15.5"></circle>
                </svg>
                <div class="ctx-ring-tip" id="ctxRingTip">上下文使用情况</div>
            </div>
            <input type="text" id="msgInput" placeholder="输入你的数据查询需求..." onkeydown="if(event.key==='Enter') sendMsg()" />
            <button id="sendBtn" onclick="sendMsg()">发送</button>
        </div>
    </div>
</div>

<!-- 称呼设置弹层（首次进入显示，用户可自行选择确定或跳过，不用 prompt 避免切窗口消失） -->
<div class="name-overlay" id="nameOverlay" style="display:none;">
    <div class="name-dialog">
        <h3>设置您的称呼</h3>
        <p class="name-dialog-desc">仅用于区分不同用户的对话，测试用</p>
        <input type="text" id="nameInput" placeholder="请输入称呼（可留空）" maxlength="30" onkeydown="if(event.key==='Enter') confirmName()" />
        <div class="name-dialog-btns">
            <button id="nameConfirm" onclick="confirmName()">确定</button>
            <button id="nameSkip" class="secondary" onclick="skipName()">取消</button>
        </div>
    </div>
</div>

<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/vendor/echarts-wordcloud.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
