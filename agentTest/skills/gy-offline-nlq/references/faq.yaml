  - question: 换电业务平台都有哪些？
    answer: 换电业务当前有 3 个平台，pt_platform 取值为 cos（科斯特）、lns（锂纳斯）、xfx（小飞侠）。通常在表中记录的字段是"pt_platform"。查询全部平台时使用 IN ('cos','lns','xfx')，且各平台数据需分别展示再给合计，不能只给总和。
  - question: 美团天数池有哪些平台
    answer: 美团天数池是美团线上渠道（mei_tuan / mei_tuan_online）的天数池模式，不是按传统换电平台（cos/lns/xfx）划分的。天数池指公司提供一定天数售卖给加盟商，加盟商购买天数后，用户消耗加盟商的天数使用电池。统计维度是大区经理+电池分组。
  - question: 美团天数池的净增怎么算
    answer: 美团天数池净增 = 新增订单数 + 转租新增订单数 - 退租订单数 - 转租退租订单数。与通用换电业务（净增 = 新增 - 退租）不同，多了转租新增和转租退租两个指标。
  - question: 转租新增和转租退租分别是什么意思
    answer: 转租是指电池从A电池分组转到B电池分组。对A分组来说是转租退租（订单减少），对B分组来说是转租新增（订单增加）。例如骑手从三代电池换成四代电池，三代分组计一次转租退租，四代分组计一次转租新增。
  - question: 淘宝天数池是什么
    answer: 淘宝天数池是换电业务在淘宝闪购平台上的天数池模式。天数池指公司提供一定天数售卖给加盟商，加盟商购买天数后，用户消耗加盟商的天数使用电池。统计维度包括大区经理和电池分组，核心指标有租赁中、新增、转租新增、退租、转租退租、净增。
  - question: 淘宝天数池的净增怎么算
    answer: 淘宝天数池净增 = 新增订单数 + 转租新增订单数 - 退租订单数 - 转租退租订单数。与美团天数池公式一致，与通用换电业务（净增 = 新增 - 退租）不同。
  - question: 淘宝天数池和美团天数池有什么区别
    answer: 淘宝天数池和美团天数池都是天数池模式，核心指标相同（租赁中、新增、转租新增、退租、转租退租、净增）。天数池指公司提供一定天数售卖给加盟商，加盟商购买天数后，用户消耗加盟商的天数使用电池。区别在于渠道不同：淘宝天数池是淘宝闪购渠道（dealership），美团天数池是美团线上渠道（mei_tuan / mei_tuan_online）。两者数据存储在各自的 ADS 层聚合表中。
  - question: 光宇天数池是什么
    answer: 光宇天数池是换电业务在光宇自有渠道上的天数池模式。天数池指公司提供一定天数售卖给加盟商，加盟商购买天数后，用户消耗加盟商的天数使用电池。统计维度包括大区经理和电池分组，核心指标有租赁中、新增、转租新增、退租、转租退租、净增。
  - question: 光宇天数池的净增怎么算
    answer: 光宇天数池净增 = 新增订单数 + 转租新增订单数 - 退租订单数 - 转租退租订单数。与美团、淘宝天数池公式一致，与通用换电业务（净增 = 新增 - 退租）不同。
  - question: 光宇、美团、淘宝天数池有什么区别
    answer: 三者都是天数池模式，核心指标相同。天数池指公司提供一定天数售卖给加盟商，加盟商购买天数后，用户消耗加盟商的天数使用电池。区别在于渠道：光宇是自有渠道，美团是美团线上渠道（mei_tuan/mei_tuan_online），淘宝是淘宝闪购渠道（dealership）。三者数据存储在各自的 ADS 层聚合表中。
  - question: 美团天数池都开通了哪些城市
    answer: 从天数池 SKU 配置链路统计（day_pool_sku_tb -> pool -> area -> region -> city），渠道过滤 channel_type IN ('mei_tuan','mei_tuan_online')。注意这是开通口径，包含尚未产生订单的城市；有订单的数据在 ads_gundam_boss_meituan_renting_day 日报表。
  - question: 淘宝天数池都开通了哪些城市
    answer: 与美团天数池同链路，渠道过滤 day_pool_tb.channel_type = 'dealership'。
  - question: 光宇天数池都开通了哪些城市
    answer: 与美团天数池同链路，渠道过滤 day_pool_tb.channel_type = 'zhi_xin'。光宇渠道池子较少，当前主要集中在北京大区（锂纳斯4860等池子）。
  - question: 天数池开通城市和有订单城市有什么区别
    answer: 开通城市从 ods_center.day_pool_sku_tb 配置链路统计（SKU 上架即算开通），有订单城市从 data_project.ads_gundam_boss_*_renting_day 日报表统计。开通 >= 有订单；差集就是"已开通但还没产生订单"的城市，可LEFT JOIN 对比得到。
  - question: 双月套餐是什么
    answer: 双月套餐是换电业务的特殊套餐形态：租约模式为月组合（rent_mode='month-combine'）且价格类型为商品活动价（price_type='goods-action-price'）且支付成功的订单流水。三个条件缺一不可。它和普通月租/多月租不同：普通月租到期可续可不续，双月套餐到期前用户必须二选一表态——续租（recharge）或退租（refund），因此有"全额表态"和"全额续租率"概念。核心指标有新增、租赁中、续租、退租、全额表态、全额续租率、提前续租、提前退租。
  - question: 双月套餐的全额表态和全额续租率是什么
    answer: 双月套餐到期前用户必须选择续租或退租，两者合计即全额表态订单数；全额续租率 = 续租订单数 /（续租订单数 + 退租订单数），分母为 0 时显示 0。续租/退租事件从 dwm_exchange_battery_renewal_refund_analysis_day 的 tag 区分（recharge=续租，refund=退租）。
  - question: 双月套餐的对账公式（昨日租赁中/hy）是什么
    answer: 月报对账列：昨日租赁中 = 前一天 pt_dt 截面的双月套餐租赁中订单数；hy（回收）= 昨日租赁中 + 当日新增 - 当日租赁中 - 当日续租 - 当日退租，负值表示有订单回流（如退还后又重新租赁）。用这两列可校验每日数据自洽。
  - question: 提前续租和提前退租是什么
    answer: 双月套餐在逻辑租期结束日之前就发生续租/退租的行为。判定标准：逻辑租期结束时间 logic_end_time 的日期部分大于事件发生日 pt_dt，即 replace(substr(logic_end_time,1,10),'-','') > pt_dt。
